{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Document</title>
</head>
<body>
    <section class="bg-black min-h-screen flex flex-col items-center justify-center text-white">
            <img src="{% static 'logo/logo.svg'%}" alt="" class="h-14">
            <div class="bg-gray-950 max-w-3xl flex rounded-2xl p-5">
                <div class="sm:w-1/2 px-16 ">
                    <div class="flex gap-4">
                        <i class="fa-solid fa-user fa-2x"></i>
                        <p class="font-bold text-3xl">Sign Up</p>
                    </div>
                    <p class="mt-3 text-sm font-semibold">Create Your Account!</p>
                    <form action="" class="flex flex-col gap-4" method="post">
                        {% csrf_token %}
                        <input type="text" name="username" placeholder="Username" class="mt-4 border p-2 rounded-2xl">
                        <input type="email" name="email" placeholder="Email" class="border p-2 rounded-2xl">
                        <input type="password" name="password1" placeholder="Password" class="border p-2 rounded-2xl">
                        <input type="password" name="password2" placeholder="Password Confirmation" class="border p-2 rounded-2xl">
                        <button class="bg-blue-500 p-2 rounded-2xl text-white">Submit</button>
                    </form>
                    <p class="border border-t mt-4"></p>
                    <div class="flex items-center justify-between">
                        <p class="text-sm mt-4 font-semibold">Already Existing An Account?</p>
                        <a href="{% url 'acclogin'%}" class="mt-4 bg-red-500 w-1/2 p-2  rounded-2xl text-center text-white">Log In</a>
                    </div>
                </div>
                <div class="sm:block hidden w-1/2">
                    <img src="{% static 'images/signup.jpg'%}" alt="" class="rounded-2xl">
                </div>
            </div>
            <p class="bottom-4 absolute font-semibold">Application For Learners</p>
    </section>
</body>
</html>
