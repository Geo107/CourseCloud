{% extends 'core/base.html' %}
{% load static %}
{% block base %}
    <div class="bg-black text-white p-5 min-h-screen">
        <p class="text-center text-3xl">{{course.title}}</p>
        <div class="grid sm:grid-cols-3">
            <div class="col-span-2 border-e p-2">
                <h2 class="text-2xl"><i class="fa-solid fa-video"></i>&nbsp; {{lesson}}</h2>
                <iframe width="100%" height="375" src="{{lesson.video}}" title="YouTube video player" 
                frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            <div class="col-span-1 bg-black text-white">
                <p class="text-center text-3xl">Modules & Lessons</p>
                <div class="p-5">
                    {% for module in course.modules.all %}
                    <div id="accordion-collapse" data-accordion="collapse" class="rounded-base border border-default overflow-hidden shadow-xs rounded-2xl mt-2">
                    <h2 id="accordion-collapse-heading-1">
                        <button type="button" class="flex items-center justify-between w-full p-5 font-medium rtl:text-right text-body rounded-t-base border border-t-0 border-x-0 border-b-default hover:text-heading hover:bg-neutral-secondary-medium gap-3" data-accordion-target="#accordion-collapse-body-{{module.id}}" aria-expanded="true" aria-controls="accordion-collapse-body-1">
                        <span>{{module.title}}</span>
                        <svg data-accordion-icon class="w-5 h-5 rotate-180 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 15 7-7 7 7"/></svg>
                        </button>
                    </h2>
                    {% for lesson in module.lessons.all %}
                    <div id="accordion-collapse-body-{{module.id}}" class="hidden border border-s-0 border-e-0 border-t-0 border-b-default" aria-labelledby="accordion-collapse-heading-1">
                        <div class="p-4 md:p-5">
                            <a  href="{% url 'mylessons' course.id %}?lesson={{lesson.id}}" class="mb-2 text-body block"><i class="fa-solid fa-circle-play"></i> {{lesson.title}}</a>
                        </div>
                    </div>
                    {% endfor %}
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
{% endblock base %}
