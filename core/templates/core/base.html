{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flowbite@latest/dist/flowbite.min.js"></script>
    <title>Document</title>
</head>
<body>
    <header class="flex flex-wrap sm:justify-start sm:flex-nowrap w-full py-3 bg-navbar border-b border-navbar-line bg-black text-white">
        <nav class="max-w-340 w-full mx-auto px-4 flex flex-wrap basis-full items-center justify-between">
            <a class="sm:order-1 flex-none text-xl font-semibold text-foreground focus:outline-hidden focus:opacity-80" href="{% url 'home' %}"><img src="{% static  'logo/logo.svg'%}" alt="" class="h-6"></a>
            <div class="sm:order-3 flex items-center gap-x-2">
            <button type="button" class="sm:hidden hs-collapse-toggle relative size-9 flex justify-center items-center gap-x-2 rounded-lg bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus disabled:opacity-50 disabled:pointer-events-none" id="hs-navbar-alignment-collapse" aria-expanded="false" aria-controls="hs-navbar-alignment" aria-label="Toggle navigation" data-hs-collapse="#hs-navbar-alignment">
                <svg class="hs-collapse-open:hidden shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
                <svg class="hs-collapse-open:block hidden shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                <span class="sr-only">Toggle</span>
            </button>
            <a type="button" class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus disabled:opacity-50 disabled:pointer-events-none hover:bg-red-500 hover:text-white" href="{% url 'acclogout' %}">
                Log Out
            </a>
            </div>
            <div id="hs-navbar-alignment" class="hs-collapse hidden overflow-hidden transition-all duration-300 basis-full grow sm:grow-0 sm:basis-auto sm:block sm:order-2" aria-labelledby="hs-navbar-alignment-collapse" role="region">
            <div class="flex flex-col gap-5 mt-5 sm:flex-row sm:items-center sm:mt-0 sm:ps-5">
                <a class="text-sm font-medium text-primary-active focus:outline-hidden" href="#" aria-current="page"><i class="fa-solid fa-user"></i>{{request.user}}</a>
                <a class="text-sm text-navbar-nav-foreground hover:text-primary-hover focus:outline-hidden focus:text-primary-focus flex gap-0.5 items-center justify-center" href="{% url 'cart'  %}">Cart <span class="px-0.5 py-0.5 bg-red-500 text-white">{{cart_count}}</span></a>
                <a class="text-sm text-navbar-nav-foreground hover:text-primary-hover focus:outline-hidden focus:text-primary-focus" href="{% url 'wishlist' %}">Wishlist <span class="px-0.5 py-0.5 bg-red-500 text-white">{{wishlist_count}}</span></a>
                <a class="text-sm text-navbar-nav-foreground hover:text-primary-hover focus:outline-hidden focus:text-primary-focus" href="{% url 'mycourses' %}">My Courses</a>
            </div>
            </div>
        </nav>
    </header>
    
    <div style="min-height: 70vh;">
        {% block base %}
        {% endblock base %}
    </div>
    
    <section class="bg-gray-800 w-full">
        <div class="grid sm:grid-cols-2">
            <div class="p-5 sm:flex">
                <img src="{% static 'logo/main_logo.svg' %}" alt="" class="h-40 shadow-2xl rounded-2xl">
                <img src="{% static 'logo/logo.svg' %}" alt="" class="sm:hidden h-8 ">
                <p class="text-sm font-semibold p-2 text-white">Personally developed python django web application solely for learning web development.<img src="{% static 'logo/logo.svg' %}" alt="" class="hidden sm:block h-14"></p>
            </div>
            <div class="p-5">
                <h3 class="text-xl text-white font-bold">Feedback: </h3>
                <textarea name="" id="" class="w-full bg-white rounded-2xl p-5" placeholder="Enter your feedback"></textarea>
                <button class="bg-green-500 text-white text-center rounded-2xl shadow-2xl p-2 w-full ">Submit</button>
            </div>
        </div>
    </section>

</body>
</html>
